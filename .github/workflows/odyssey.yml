name: Toxic ticket watcher

on:
  schedule:
    # Every 15 min, offset off the hour (UTC) to dodge peak-load delays.
    # GitHub doesn't guarantee timing — runs can still be 10–30 min late.
    - cron: "*/5 * * * *"
  workflow_dispatch:      # lets you trigger a run manually to test
    inputs:
      target_date:
        description: "Date to check (YYYYMMDD). Blank uses the script default."
        required: false
      movie_keyword:
        description: "Movie title substring. Blank uses 'toxic'."
        required: false
      format_keyword:
        description: "Format substring. Blank uses 'dolby'."
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright requests
          python -m playwright install --with-deps chromium

      - name: Check for tickets
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          EXTRA_CHAT_IDS: ${{ secrets.EXTRA_CHAT_IDS }}
          TARGET_DATE: ${{ inputs.target_date }}
          MOVIE_KEYWORD: ${{ inputs.movie_keyword }}
          FORMAT_KEYWORD: ${{ inputs.format_keyword }}
        run: python check_once.py

      - name: Save page snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot
          path: |
            hit.png
            hit.html
            state.json
          if-no-files-found: ignore
